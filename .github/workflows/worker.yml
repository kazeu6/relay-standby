name: relay

# Menyalakan satu proses relay yang menganggur sambil menunggu perintah
# lewat MQTT. Dipicu oleh pengelola di mesin lokal, bukan oleh commit.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: topik untuk perintah masuk
        required: true
      pool:
        description: topik untuk laporan keluar
        required: false
      idle:
        description: detik menganggur sebelum keluar
        required: false
        default: '600'

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: siapkan dependensi
        run: pip install --quiet curl_cffi
      - name: jalankan
        env:
          TOPIC: ${{ inputs.topic }}
          POOL: ${{ inputs.pool }}
          IDLE: ${{ inputs.idle }}
        run: |
          # Nama repo diambil dari konteks, bukan ditulis di sini: kalau repo
          # diganti nama, workflow ini tidak perlu diubah.
          #
          # Pakai commit SHA eksplisit (${{ github.sha }}), BUKAN `/main?rev=...`:
          # CDN raw.githubusercontent.com mengabaikan query string dan meng-cache
          # `/main` hingga ~5 menit setelah push, sehingga worker baru bisa menarik
          # versi lama. SHA bersifat immutable dan langsung segar saat push.
          B="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          curl -sS -m 30 -o /tmp/worker.py "$B/worker.py"
          curl -sS -m 30 -o /tmp/mqtt.py "$B/mqtt.py"
          python3 /tmp/worker.py
