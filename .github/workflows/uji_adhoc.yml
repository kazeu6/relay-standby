name: uji_adhoc

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Python & dependensi
        run: |
          pip install --quiet curl_cffi

      - name: Jalankan uji detail bypass
        run: |
          python3 uji_detail_bypass.py

      - name: Jalankan uji built-in tools
        run: |
          python3 uji_built_in_tools.py